[package]
name = "horizon-launcher"
version = "1.0.0"
edition = "2021"

[dependencies]
anyhow = "1"
dirs = "5"
eframe = "0.27"
flate2 = "1"
md5 = "0.7"
open = "5"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde_json = "1"
sha1 = "0.10"
tar = "0.4"
zip = "2"

[profile.release]
opt-level = 3
lto = true
strip = true
